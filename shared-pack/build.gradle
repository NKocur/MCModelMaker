def filesBelow = { File root ->
    if (!root.exists()) return [] as Set
    def paths = [] as Set
    root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
        paths.add(root.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
    }
    paths
}

