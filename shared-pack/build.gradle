            'blocksmith:blackwake_gold_doubloon', 'blocksmith:blackwake_card_back',
            'blocksmith:blackwake_exchange_clerk', 'blocksmith:blackwake_boatman',
            'blocksmith:emerald_fortune_roulette', 'blocksmith:blackwake_blackjack_table',
            'blocksmith:blackwake_casino_war_table', 'blocksmith:blackwake_corsair_coin_toss',
            'blocksmith:wall_derby_control_panel', 'blocksmith:wall_derby_lane_panel',
            'blocksmith:wall_derby_lane_end_panel', 'blocksmith:wall_derby_marquee_panel',
            'blocksmith:wall_derby_start_marker', 'blocksmith:wall_derby_finish_marker'
    ])
    ['deckhand_s_lucky_bones', 'blackwake_skulljack', 'dread_admiral_s_kraken_jackpot'].each { machine ->
        ids.add("blocksmith:${machine}" as String)
        ['cabinet', 'skull_reel', 'doubloon_reel', 'parrot_reel', 'pull_lever'].each { bone ->
            ids.add("blocksmith:${machine}/bone/${bone}" as String)
        }
    }
    [
            emerald_fortune_roulette: ['roulette_table', 'roulette_wheel', 'roulette_ball_orbit'],
            blackwake_blackjack_table: ['blackjack_table', 'player_ace', 'player_king', 'dealer_face-up_card', 'dealer_hole_card'],
            blackwake_casino_war_table: ['casino_war_table', 'player_battle_card', 'dealer_battle_card', 'player_war_card', 'dealer_war_card'],
            blackwake_corsair_coin_toss: ['coin_toss_cabinet', 'two-sided_toss_coin', 'place_bet_lever']
    ].each { model, bones -> bones.each { bone -> ids.add("blocksmith:${model}/bone/${bone}" as String) } }

    def ranks = ['ace','two','three','four','five','six','seven','eight','nine','ten','jack','queen','king']
    def suits = ['spades','hearts','clubs','diamonds']
    def blackjackBones = ['player_ace','player_king','dealer_face-up_card','dealer_hole_card']
    def warBones = ['player_battle_card','dealer_battle_card','player_war_card','dealer_war_card']
    suits.each { suit -> ranks.each { rank ->
        def card = "blackwake_${rank}_of_${suit}"
        ids.add("blocksmith:${card}" as String)
        blackjackBones.each { bone -> ids.add("blocksmith:blackwake_blackjack_table/cards/${bone}/${card}" as String) }
        warBones.each { bone -> ids.add("blocksmith:blackwake_casino_war_table/cards/${bone}/${card}" as String) }
    }}
